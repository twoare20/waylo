<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아고다 API 테스트</title>
</head>
<body style="font-family:sans-serif;padding:20px">
<h2>아고다 API 테스트</h2>
<button onclick="testAgoda()" style="padding:12px 24px;background:#003580;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer">서울 호텔 검색</button>
<div id="result" style="margin-top:20px;font-size:13px"></div>

<script>
async function testAgoda(){
  document.getElementById('result').innerHTML = '검색 중...';
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate()+1);
  const fmt = d => d.toISOString().split('T')[0];
  
  try {
    const res = await fetch('https://waylo-agoda.twoare123.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        criteria: {
          additional: {
            currency: 'KRW',
            language: 'ko-kr',
            maxResult: 5,
            occupancy: { numberOfAdult: 2, numberOfChildren: 0 }
          },
          checkInDate: fmt(today),
          checkOutDate: fmt(tomorrow),
          cityId: 14690
        }
      })
    });
    
    const data = await res.json();
    
    if(data.results) {
      let html = '✅ 성공! 호텔 ' + data.results.length + '개<br><br>';
      data.results.forEach(h => {
        html += `<div style="border:1px solid #ddd;padding:10px;margin-bottom:8px;border-radius:8px">
          <img src="${h.imageURL}" style="width:100%;border-radius:8px;margin-bottom:8px"><br>
          <b>${h.hotelName}</b><br>
          ⭐ ${h.starRating} | 리뷰 ${h.reviewScore}<br>
          💰 ${h.dailyRate?.toLocaleString()}원/박<br>
          <a href="${h.landingURL}" target="_blank" style="color:blue">아고다에서 예약</a>
        </div>`;
      });
      document.getElementById('result').innerHTML = html;
    } else {
      document.getElementById('result').innerHTML = '❌ ' + JSON.stringify(data);
    }
  } catch(e) {
    document.getElementById('result').innerHTML = '❌ 오류: ' + e.message;
  }
}
</script>
</body>
</html>
